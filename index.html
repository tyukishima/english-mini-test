<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>英語5問ミニテスト</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f6f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:680px;margin:auto;padding:22px 16px 40px} header{background:#2563eb;color:white;border-radius:22px;padding:22px;margin-bottom:16px}
h1{margin:0 0 8px;font-size:25px} .sub{opacity:.9} .card{background:white;border-radius:20px;padding:20px;box-shadow:0 5px 20px #00000010;margin-bottom:14px}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#2563eb;color:white;margin-top:10px}
button.secondary{background:#e9edf5;color:#172033} .qno{font-size:13px;color:#68738a} .q{font-size:21px;font-weight:700;line-height:1.6;margin:8px 0 18px}
textarea{width:100%;min-height:120px;border:1px solid #ccd3df;border-radius:14px;padding:14px;font-size:17px;resize:vertical}
.answer{background:#f0f4ff;border-radius:14px;padding:15px;line-height:1.6;margin-top:14px} .hidden{display:none}
.stat{display:flex;gap:8px;flex-wrap:wrap} .pill{background:#eef1f6;border-radius:999px;padding:8px 12px;font-size:14px}
.small{font-size:13px;color:#68738a;line-height:1.6}
</style></head>
<body><div class="wrap">
<header><h1>英語5問ミニテスト</h1><div class="sub">毎回5問。間違えた問題を少し多めに復習します。</div></header>
<div id="home" class="card">
<div class="stat"><span class="pill">実施回数：<b id="tries">0</b></span><span class="pill">要復習：<b id="weak">0</b></span></div>
<button id="start">5問スタート</button>
<p class="small">※自由記述なので、答えを表示した後に「正解／要復習」を自分で判定します。</p>
</div>
<div id="test" class="card hidden"></div>
<div id="result" class="card hidden"></div>
</div>
<script>
const questions = [{"q": "私は毎朝7時に起きます。", "a": "I get up at seven every morning."}, {"q": "彼は英語を上手に話します。", "a": "He speaks English well."}, {"q": "あなたは昨日何をしましたか？", "a": "What did you do yesterday?"}, {"q": "私は週末にテニスをします。", "a": "I play tennis on weekends."}, {"q": "彼女は今、本を読んでいます。", "a": "She is reading a book now."}, {"q": "私は東京に3年間住んでいます。", "a": "I have lived in Tokyo for three years."}, {"q": "この本はあの本より面白いです。", "a": "This book is more interesting than that one."}, {"q": "明日、雨が降るかもしれません。", "a": "It may rain tomorrow."}, {"q": "私は英語を勉強するために毎日時間を作っています。", "a": "I make time every day to study English."}, {"q": "彼は宿題を終えたところです。", "a": "He has just finished his homework."}, {"q": "駅まで歩いてどのくらいかかりますか？", "a": "How long does it take to walk to the station?"}, {"q": "私は子どものころ、よくここで遊びました。", "a": "I often played here when I was a child."}, {"q": "彼女に会ったことがありますか？", "a": "Have you ever met her?"}, {"q": "もっとゆっくり話していただけますか？", "a": "Could you speak more slowly?"}, {"q": "私はそのニュースを聞いて驚きました。", "a": "I was surprised to hear the news."}, {"q": "彼は医者になるために勉強しています。", "a": "He is studying to become a doctor."}, {"q": "もし時間があれば、私たちと一緒に来てください。", "a": "If you have time, please come with us."}, {"q": "私はこの問題を自分で解決しなければなりません。", "a": "I have to solve this problem myself."}];
const KEY="eng5data";
let data=JSON.parse(localStorage.getItem(KEY)||"{}");
data.stats=data.stats||{tries:0,correct:0,wrong:0};
data.qs=data.qs||{};
let current=[], idx=0, score=0;
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function pick5(){
 let pool=[...questions];
 pool.sort((a,b)=>(Math.random()-(0.5)));
 return pool.slice(0,5);
}
function renderQuestion(){
 const q=current[idx];
 document.getElementById("test").innerHTML=`<div class="qno">第 ${idx+1} / 5 問</div><div class="q">${q.q}</div>
 <textarea id="ans" placeholder="英語で答えてください"></textarea>
 <button id="show">答えを確認</button>
 <div id="revealed" class="hidden">
   <div class="answer"><b>例：</b>${q.a}</div>
   <button id="wrong" class="secondary">✕ 間違い・要復習</button>
   <button id="right">○ 正解</button>
 </div>`;
 document.getElementById("show").onclick=()=>document.getElementById("revealed").classList.remove("hidden");
 document.getElementById("wrong").onclick=()=>judge(false);
 document.getElementById("right").onclick=()=>judge(true);
}
function judge(ok){
 const q=current[idx], s=data.qs[q.q]||{correct:0,wrong:0};
 if(ok){s.correct++;score++;} else s.wrong++;
 data.qs[q.q]=s; data.stats[ok?"correct":"wrong"]++; save();
 idx++; if(idx<5) renderQuestion(); else finish();
}
function finish(){
 data.stats.tries++; save();
 document.getElementById("test").classList.add("hidden");
 const r=document.getElementById("result"); r.classList.remove("hidden");
 r.innerHTML=`<h2>お疲れさまでした！</h2><p style="font-size:24px;font-weight:700">${score} / 5 正解</p><button id="again">もう一度5問</button>`;
 document.getElementById("again").onclick=start;
 updateHome();
}
function start(){
 current=pick5();idx=0;score=0;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("test").classList.remove("hidden"); renderQuestion();
}
function updateHome(){
 document.getElementById("tries").textContent=data.stats.tries;
 document.getElementById("weak").textContent=Object.values(data.qs).filter(x=>(x.wrong||0)>(x.correct||0)).length;
}
document.getElementById("start").onclick=start; updateHome();
</script></body></html>
